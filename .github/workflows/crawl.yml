name: crawl
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: crawl
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: store.json, CODEOWNERS and the page, from extensions/ and every registry entry's newest release
        run: node scripts/store.mjs build . --source "git:github.com/${{ github.repository }}@${{ github.sha }}" --repo "${{ github.repository }}" || true
      - name: Commit what changed
        run: |
          git config user.name "jevie-store"; git config user.email "jevie-store@users.noreply.github.com"
          git add store.json index.html .github/CODEOWNERS
          git diff --cached --quiet || (git commit -m "store: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
