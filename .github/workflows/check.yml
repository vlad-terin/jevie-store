name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Changed registry entries, and their newest release
        run: |
          for f in $(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- 'registry/*.json'); do
            node scripts/store.mjs check-entry "$f"
          done
      - name: Jevie's own extensions
        run: |
          for d in extensions/*/; do node scripts/store.mjs check "$d" --quick; done
